$kind: http-request
description: Reads back what the upload actually created — branch-scoped like the rest of Phase 0 (a MANAGER token only works here if scoped to this branch).
url: "{{baseUrl}}/businesses/{{businessId}}/branches/{{branchAId}}/transactions"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{ownerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', function () {
        pm.response.to.have.status(200);
      });
    language: text/javascript
order: 4000
