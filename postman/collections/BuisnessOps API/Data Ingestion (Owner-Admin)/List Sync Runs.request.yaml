$kind: http-request
description: History of ingestion runs for this data source, most recent first.
url: "{{baseUrl}}/businesses/{{businessId}}/data-sources/{{dataSourceId}}/sync-runs"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{ownerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', function () {
        pm.response.to.have.status(200);
      });
    language: text/javascript
order: 3000
