$kind: http-request
description: Returns the authenticated user plus all of their Memberships (id, businessId, role, status).
url: "{{baseUrl}}/auth/me"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{ownerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', function () {
        pm.response.to.have.status(200);
      });
      pm.test('Password hash is never returned', function () {
        pm.expect(pm.response.json()).to.not.have.property('passwordHash');
      });
    language: text/javascript
order: 5000
