$kind: http-request
description: Scopes the manager's membership to Branch A only. Branch B is deliberately left out so the next folder can demonstrate the block.
url: "{{baseUrl}}/businesses/{{businessId}}/memberships/{{membershipId}}/branch-access"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "branchId": "{{branchAId}}"
    }
auth:
  type: bearer
  credentials:
    token: "{{ownerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Branch access granted (201)', function () {
        pm.response.to.have.status(201);
      });
    language: text/javascript
order: 2000
