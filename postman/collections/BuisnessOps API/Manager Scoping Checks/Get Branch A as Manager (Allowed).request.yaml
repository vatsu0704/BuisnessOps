$kind: http-request
description: Run 'Login (Manager)' after granting branch access, so managerToken is set. Expect 200 — the manager is scoped to this branch.
url: "{{baseUrl}}/businesses/{{businessId}}/branches/{{branchAId}}"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{managerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200 - manager is scoped to Branch A', function () {
        pm.response.to.have.status(200);
      });
    language: text/javascript
order: 1000
