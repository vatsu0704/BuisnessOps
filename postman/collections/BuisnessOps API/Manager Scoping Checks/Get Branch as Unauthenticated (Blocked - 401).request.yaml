$kind: http-request
description: No Authorization header at all. Expect 401 from requireAuth, before tenant/role logic even runs.
url: "{{baseUrl}}/businesses/{{businessId}}/branches/{{branchAId}}"
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 401 - no Authorization header', function () {
        pm.response.to.have.status(401);
      });
    language: text/javascript
order: 4000
