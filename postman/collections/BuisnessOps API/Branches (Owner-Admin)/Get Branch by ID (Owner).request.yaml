$kind: http-request
description: OWNER/ADMIN can fetch any branch id in their business.
url: "{{baseUrl}}/businesses/{{businessId}}/branches/{{branchAId}}"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{ownerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', function () {
        pm.response.to.have.status(200);
      });
    language: text/javascript
order: 4000
