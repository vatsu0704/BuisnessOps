<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      These are the only places the web types a brand value by hand: everything
      here renders before any script does, so it cannot read constants/brand.ts
      or tokens.css. Keep them in step with those two.
    -->
    <title>KitnaPay</title>
    <meta name="description" content="Sales, branches, staff and supply for multi-branch retail and food businesses." />
    <meta name="theme-color" content="#042A5E" />

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="KitnaPay" />
    <meta property="og:title" content="KitnaPay" />
    <meta property="og:description" content="Sales, branches, staff and supply for multi-branch retail and food businesses." />
    <!--
      Absolute, and deliberately not served from public/: the service worker
      precaches everything in dist/, so a 1200x630 image there would be a
      mandatory download for every visitor. Upload store-listing/og-card.png
      and point this at it. Until then the card has no image rather than a
      broken one, which is why it is commented out.
      <meta property="og:image" content="https://REPLACE_ME/og-card.png" />
    -->
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
