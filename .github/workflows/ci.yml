name: CI

on:
  push:
    branches: [master]
  pull_request: {}

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: buisnessops_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/buisnessops_ci?schema=public
      JWT_SECRET: ci-test-secret
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Applies every committed migration to a brand-new database. Catches
      # the case where schema.prisma was edited without a matching
      # migration file, or a migration itself is broken — separate from
      # (and before) `prisma generate`, which only checks the schema
      # compiles, not that it's actually deployable.
      - name: Verify migrations apply cleanly
        run: npx prisma migrate deploy

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run tests
        run: npm test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # No test runner is set up on the frontend yet (package.json's "test"
      # script references jest, which isn't installed) — type-checking is
      # the one real, currently-passing check available.
      - name: Type-check
        run: npm run lint

      # tsc does NOT catch this: i18next.d.ts types t() against en.json alone,
      # so a key missing from hi/gu/mr compiles cleanly and silently falls back
      # to English at runtime. This is the only mechanical guard there is.
      - name: Check translation parity
        run: npm run lint:i18n

      # The API sends error codes, not prose, and the wording lives in the
      # locale files. A code with no entry there falls back to the server's
      # English, which works — and so silently un-translates that message for
      # every Hindi, Gujarati and Marathi user. The step above cannot see it,
      # because a code missing from all four locales is perfectly consistent.
      - name: Check error-code coverage
        run: npm run lint:errors

      # Authorization is decided twice — the server decides whether a request is
      # allowed, the app decides whether to render the control that makes it.
      # tsc type-checks the frontend mirror against itself, so a mirror that
      # disagrees with the backend is still internally consistent and compiles
      # fine. The symptom is a button that 403s, or a feature nobody can find.
      - name: Check permission-matrix parity
        run: npm run lint:permissions
